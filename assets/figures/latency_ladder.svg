<text x="590" y="404" font-size="13" fill="#6f7f92" text-anchor="middle" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">A VLA answers in the time a human needs for a conscious decision; a spinal reflex has already acted ten times over. Order-of-magnitude figures from the literature.</text>
