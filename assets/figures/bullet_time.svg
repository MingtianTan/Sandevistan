<text x="712" y="358" font-size="12" fill="#6f7f92" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">wall-clock time →</text>
<text x="68" y="80" font-size="12" fill="#6f7f92" text-anchor="end" transform="rotate(-90 68 80)" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace"></text>
<text x="62" y="200.0" font-size="13" fill="#a9b6c5" text-anchor="middle" transform="rotate(-90 62 200.0)" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">progress through the VLA chunk (phase)</text>
<text x="230" y="120" font-size="13" fill="#ff2fd1" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">nominal: the chunk plays at 20 Hz regardless</text>
<text x="475" y="292" font-size="13" fill="#19e6ff" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">with SPINE: phase slows to a crawl, pose is corrected,</text>
<text x="475" y="310" font-size="13" fill="#19e6ff" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">then the plan catches up — the world ran slower for it</text>
<rect x="770" y="60" width="370" height="78" rx="8" fill="#121824" stroke="#243041"/>
<rect x="770" y="60" width="4" height="78" rx="2" fill="#3dff9a" filter="url(#glow)"/>
<text x="788" y="88" font-size="18" font-weight="700" fill="#3dff9a" font-family="'Rajdhani','Source Sans 3',system-ui,sans-serif">level 1 · residual</text>
<text x="788" y="110" font-size="13" fill="#a9b6c5" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">small error: add a correction to the chunk;</text>
<text x="788" y="127" font-size="13" fill="#a9b6c5" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">the plan keeps its timing</text>
<rect x="770" y="152" width="370" height="78" rx="8" fill="#121824" stroke="#243041"/>
<rect x="770" y="152" width="4" height="78" rx="2" fill="#19e6ff" filter="url(#glow)"/>
<text x="788" y="180" font-size="18" font-weight="700" fill="#19e6ff" font-family="'Rajdhani','Source Sans 3',system-ui,sans-serif">level 2 · bullet time</text>
<text x="788" y="202" font-size="13" fill="#a9b6c5" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">large error: scale the plan's phase velocity down,</text>
<text x="788" y="219" font-size="13" fill="#a9b6c5" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">correct, then catch up</text>
<rect x="770" y="244" width="370" height="78" rx="8" fill="#121824" stroke="#243041"/>
<rect x="770" y="244" width="4" height="78" rx="2" fill="#ff2fd1" filter="url(#glow)"/>
<text x="788" y="272" font-size="18" font-weight="700" fill="#ff2fd1" font-family="'Rajdhani','Source Sans 3',system-ui,sans-serif">level 3 · takeover</text>
<text x="788" y="294" font-size="13" fill="#a9b6c5" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">unrecoverable: run the safety behaviour, send the</text>
<text x="788" y="311" font-size="13" fill="#a9b6c5" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">VLA a 'plan broken' token, ask for a new chunk</text>
<text x="590" y="404" font-size="13" fill="#6f7f92" text-anchor="middle" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif">Phase control is how dynamic movement primitives handle perturbations; here the reflex layer owns the phase of the VLA's chunk.</text>
</svg>